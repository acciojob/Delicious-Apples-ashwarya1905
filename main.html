<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="product">

    <div class="product__photo">

        <div class="photo-container">

            <div class="photo-main">
                <img src="https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6" alt="Apple">
            </div>

            <div class="photo-album">
                <ul>
                    <li>
                        <img src="https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6" alt="Apple">
                    </li>
                    <li>
                        <img src="https://images.unsplash.com/photo-1570913149827-d2ac84ab3f9a" alt="Apple">
                    </li>
                    <li>
                        <img src="https://images.unsplash.com/photo-1568702846914-96b305d2aaeb" alt="Apple">
                    </li>
                </ul>
            </div>

        </div>

    </div>

    <div class="product__info">

        <h1>Fresh Apples</h1>

        <div class="price">
            $7.93
        </div>

        <div class="variant">
            <h3>VARIETY</h3>
            <ul>
                <li>
                    <img src="https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6" alt="Green Apple">
                    <span>Green</span>
                </li>
                <li>
                    <img src="https://images.unsplash.com/photo-1570913149827-d2ac84ab3f9a" alt="Yellow Apple">
                    <span>Yellow</span>
                </li>
                <li>
                    <img src="https://images.unsplash.com/photo-1619546813926-a78fa6372cd2" alt="Orange Apple">
                    <span>Orange</span>
                </li>
                <li>
                    <img src="https://images.unsplash.com/photo-1568702846914-96b305d2aaeb" alt="Red Apple">
                    <span>Red</span>
                </li>
            </ul>
        </div>

        <div class="description">
            <h3>BENEFITS</h3>
            <ul>
                <li>Rich in dietary fiber</li>
                <li>Good source of antioxidants</li>
                <li>Supports a healthy heart</li>
                <li>Helps improve digestion</li>
            </ul>
        </div>

        <button>ADD TO CART</button>

    </div>

</div>

<script src="./script.js"></script>
</body>
</html>
